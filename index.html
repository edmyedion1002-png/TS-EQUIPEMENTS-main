<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement excessivement en retard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            background: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .alert-box {
            width: 100%;
            max-width: 1450px;
            background: #fff;
            border: 3px solid #ddd;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,.10);
        }


        /* LOGO TS EQUIPEMENTS */
        .brand-logo {
            display: block;
            width: min(260px, 42vw);
            height: auto;
            margin: 0 auto 34px;
            object-fit: contain;
            filter: drop-shadow(0 8px 14px rgba(0,0,0,.12));
        }

        .brand-line {
            width: min(520px, 70%);
            height: 4px;
            margin: 0 auto 34px;
            border-radius: 999px;
            background: linear-gradient(90deg, #1c9a42 0%, #e8cf18 50%, #d71920 100%);
        }

        /* EN-TÊTE */

        .alert-header {
            padding: 42px 40px 48px;
            text-align: center;
            background: #fff7f7;
        }

        .warning {
            width: 150px;
            height: 150px;
            margin: 0 auto 35px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 7px solid #d71920;
            border-radius: 50%;

            color: #d71920;
            font-size: 100px;
            font-weight: bold;
            line-height: 1;
        }

        .alert-header h1 {
            margin: 0;
            color: #cf171d;
            font-size: clamp(35px, 4vw, 62px);
            font-weight: 700;
        }

        /* CORPS */

        .alert-content {
            padding: 65px 70px 70px;
        }

        .message {
            max-width: 1100px;
            margin: auto;
            text-align: center;
        }

        .message p {
            margin: 0 0 20px;
            color: #111;
            font-size: clamp(24px, 2.3vw, 40px);
            line-height: 1.55;
        }

        .message p:last-child {
            margin-bottom: 0;
        }

        /* BOUTON */

        .payment-button {
            display: block;
            width: min(100%, 900px);
            margin: 55px auto 0;
            padding: 25px 35px;

            border: 0;
            border-radius: 18px;

            background: #df1117;
            color: white;

            font-size: clamp(20px, 2vw, 32px);
            font-weight: bold;

            cursor: pointer;

            transition: .2s ease;
        }

        .payment-button:hover {
            background: #c70f15;
            transform: translateY(-2px);
        }

        /* MOBILE */

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            .alert-box {
                border-radius: 18px;
            }

            .alert-header {
                padding: 28px 16px 38px;
            }

            .brand-logo {
                width: min(210px, 62vw);
                margin-bottom: 22px;
            }

            .brand-line {
                width: 75%;
                height: 3px;
                margin-bottom: 25px;
            }

            .warning {
                width: 100px;
                height: 100px;
                border-width: 5px;
                font-size: 65px;
                margin-bottom: 25px;
            }

            .alert-header h1 {
                font-size: 30px;
            }

            .alert-content {
                padding: 40px 22px;
            }

            .message p {
                font-size: 21px;
            }

            .payment-button {
                margin-top: 40px;
                padding: 20px;
                font-size: 19px;
            }
        }
    </style>
</head>

<body>

    <div class="alert-box">

        <div class="alert-header">

            <img
                class="brand-logo"
                src="./assets/ts-equipements-logo.png"
                alt="TS Équipements"
            >
            <div class="brand-line" aria-hidden="true"></div>

            <div class="warning">
                !
            </div>

            <h1>
                Votre paiement est excessivement en retard
            </h1>

        </div>

        <div class="alert-content">

            <div class="message">

                <p>
                    Votre forfait mensuel n’a pas été réglé
                    à la date d’échéance.
                </p>

                <p>
                    Veuillez mettre à jour votre moyen de paiement
                    afin d’éviter une interruption du service.
                </p>

            </div>

            <button
                class="payment-button"
                onclick="window.location.href='./pages/paiement.html';"
            >
                Mettre à jour mon moyen de paiement
            </button>

        </div>

    </div>

</body>
</html>

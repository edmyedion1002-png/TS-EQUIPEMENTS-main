<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>403 Forbidden</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f6f8;
            font-family: Arial, Helvetica, sans-serif;
            color: #1f2937;
        }

        .error-container {
            width: 90%;
            max-width: 650px;
            text-align: center;
            background: #ffffff;
            padding: 50px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .error-code {
            font-size: 90px;
            font-weight: 800;
            color: #dc2626;
            line-height: 1;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #111827;
        }

        .message {
            font-size: 16px;
            line-height: 1.7;
            color: #6b7280;
        }

        .notice {
            margin-top: 25px;
            padding: 18px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #991b1b;
            font-size: 15px;
            line-height: 1.7;
        }

        .support {
            margin-top: 20px;
            font-size: 14px;
            color: #6b7280;
        }
    </style>
</head>

<body>

    <main class="error-container">

        <div class="error-code">403</div>

        <h1>Forbidden</h1>

        <p class="message">
            Serveur d'autorisation non renouvelé.
        </p>

        <div class="notice">
            Le site configuré à cette adresse a été suspendu
            pour non-paiement des forfaits souscrits.
            <br><br>
            Si c'est votre site, assurez-vous que le réabonnement
            au serveur dédié est renouvelé.
        </div>

        <p class="support">
            Veuillez contacter le service technique.
        </p>

    </main>

</body>
</html>

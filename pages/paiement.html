<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f6f8;
            font-family: Arial, Helvetica, sans-serif;
            color: #1f2937;
        }

        .error-container {
            width: 90%;
            max-width: 600px;
            text-align: center;
            background: #ffffff;
            padding: 50px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .error-code {
            font-size: 90px;
            font-weight: 800;
            color: #dc2626;
            line-height: 1;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #6b7280;
        }

        .notice {
            margin-top: 25px;
            padding: 15px;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #991b1b;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <main class="error-container">
        <div class="error-code">403</div>

        <h1>Forbidden</h1>

        <p>
            L'accès au support technique est interdit.
        </p>

        <div class="notice">
            Vous n'êtes pas autorisé à accéder à cette ressource.
        </div>
    </main>

</body>
</html>
